[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "1.1.0"
description = "A local-first, LLM-free unified personal, environment and developer assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
voice = ["vosk>=0.3.45", "sounddevice>=0.4.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nova = "nova.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
