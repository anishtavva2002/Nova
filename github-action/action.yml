name: Nova Repository Guardian
description: Deterministic, LLM-free repository analysis and security checks
author: Nova
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: |
        set -euo pipefail
        python "$GITHUB_ACTION_PATH/src/nova_action.py" \
          --path . --config github-action/.nova.json \
          --output .nova-reports --fail-on high --summary true
